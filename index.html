<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Real Estate Dashboard - Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; }
    header { background:#2c3e50; color:#fff; padding:10px 16px; }
    .container { display:flex; gap:16px; padding:16px; }
    .left, .right { flex:1; }
    .map { height:400px; }
    .kpis { display:flex; gap:12px; margin-bottom:12px; }
    .kpi { background:#ecf0f1; padding:12px; border-radius:6px; flex:1; }
    table { width:100%; border-collapse:collapse; }
    th,td { border:1px solid #ddd; padding:8px; }
    th { background:#f7f7f7; }
  </style>
</head>
<body>
  <header>
    <h1>Real Estate Dashboard (Demo)</h1>
  </header>
  <div class="container">
    <div class="left">
      <div class="kpis">
        <div class="kpi"><strong id="total-properties">0</strong><div>Total Properties</div></div>
        <div class="kpi"><strong id="inventory-value">0</strong><div>Inventory Value</div></div>
        <div class="kpi"><strong id="active-deals">0</strong><div>Active Deals</div></div>
      </div>
      <div id="map" class="map"></div>
    </div>
    <div class="right">
      <h3>Properties</h3>
      <div style="max-height:380px; overflow:auto">
        <table id="properties-table">
          <thead><tr><th>ID</th><th>Location</th><th>Size</th><th>Type</th><th>Features</th><th>Price</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <h3>Deals</h3>
      <div style="max-height:300px; overflow:auto">
        <table id="deals-table">
          <thead><tr><th>Deal</th><th>Property</th><th>Stage</th><th>Agreed Price</th><th>Registry</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const paths = {
      properties: 'data/properties.csv',
      deals: 'data/deals.csv',
      parties: 'data/parties.csv',
      documents: 'data/documents.csv',
      payments: 'data/payments.csv',
      earnings: 'data/earnings_splits.csv'
    };

    async function loadCSV(path){
      const res = await fetch(path);
      const text = await res.text();
      return Papa.parse(text, {header:true, skipEmptyLines:true}).data;
    }

    let properties=[], deals=[], parties=[];
    async function init(){
      properties = await loadCSV(paths.properties);
      deals = await loadCSV(paths.deals);
      parties = await loadCSV(paths.parties);

      renderKPIs();
      renderPropertiesTable();
      renderDealsTable();
      renderMap();
    }

    function renderKPIs(){
      const total = properties.length;
      const value = properties.reduce((s,p)=>s + (Number(p.asking_price)||0),0);
      const active = deals.filter(d=> !['Registered','Transferred','Closed'].includes(d.stage)).length;
      document.getElementById('total-properties').textContent = total;
      document.getElementById('inventory-value').textContent = value.toLocaleString();
      document.getElementById('active-deals').textContent = active;
    }

    function renderPropertiesTable(){
      const tbody = document.querySelector('#properties-table tbody');
      tbody.innerHTML = '';
      properties.forEach(p=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${p.property_id}</td><td>${p.location}</td><td>${p.size_marla}</td><td>${p.type}</td><td>${p.features||''}</td><td>${Number(p.asking_price).toLocaleString()}</td><td>${p.status}</td>`;
        tbody.appendChild(tr);
      });
    }

    function renderDealsTable(){
      const tbody = document.querySelector('#deals-table tbody');
      tbody.innerHTML = '';
      deals.forEach(d=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${d.deal_id}</td><td>${d.property_id}</td><td>${d.stage}</td><td>${Number(d.agreed_price||0).toLocaleString()}</td><td>${d.registry_date||''}</td>`;
        tbody.appendChild(tr);
      });
    }

    function renderMap(){
      const map = L.map('map').setView([31.525,74.36], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);
      properties.forEach(p=>{
        if(p.geo_lat && p.geo_lng){
          const marker = L.circleMarker([Number(p.geo_lat),Number(p.geo_lng)], {radius:8, color: p.status==='Available'? 'green':'orange'}).addTo(map);
          marker.bindPopup(`<b>${p.property_id}</b><br>${p.location}<br>${p.size_marla} marla<br>${p.type}<br>Price: ${Number(p.asking_price).toLocaleString()}`);
        }
      });
    }

    init().catch(err=>console.error(err));
  </script>
</body>
</html>
